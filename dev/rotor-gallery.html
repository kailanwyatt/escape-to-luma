<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotor visual gallery</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b28;color:#d9f1ff;font:14px system-ui}header{padding:16px;position:sticky;top:0;background:#101b28;z-index:2}h1{font-size:20px;margin:0 0 8px}label{display:inline-block;margin:4px 16px 4px 0}select{background:#253445;color:white;padding:6px;border:1px solid #587287;border-radius:5px}#gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:12px}section{border:1px solid #4c6176;border-radius:10px;overflow:hidden}h2{font-size:16px;text-transform:capitalize;margin:12px 12px 0}p{font-size:11px;margin:4px 12px 8px;color:#a7bfd0}.view{height:280px}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-0}header,h2,p{position:relative;z-index:1}section{background:transparent}#gallery.focused{display:block}#gallery.focused section{max-width:420px;margin:auto}#gallery.focused .view{height:620px}@media(max-width:800px){#gallery{grid-template-columns:repeat(2,1fr)}}
